name: Build and Test
on: 
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn org.pitest:pitest-maven:mutationCoverage \
              -DtargetClasses= com.graphhopper.storage.CHStorage \
              -DtargetTests=com.graphhopper.storage.CHStorageTest


        
  mutation-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25-ea
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download previous mutation score
        id: download
        uses: actions/download-artifact@v3
        with:
          name: mutation-score
          optional: true

      - name: Run mutation tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Extract current mutation score
        id: mutation
        run: |
          SCORE=$(grep -oP 'mutationCoverage="\K[0-9]+' target/pit-reports/*/mutations.xml | head -1)
          echo "Current mutation score: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Compare with previous score
        run: |
          if [ -f mutation-score/score.txt ]; then
            PREV_SCORE=$(cat mutation-score/score.txt)
            echo "Previous mutation score: $PREV_SCORE"
            if [ ${{ steps.mutation.outputs.score }} -lt $PREV_SCORE ]; then
              echo "Mutation score decreased ($PREV_SCORE -> ${{ steps.mutation.outputs.score }}). Failing build."
              exit 1
            fi
          else
            echo "No previous score found, skipping comparison."
          fi

      - name: Save current score file
        run: echo "${{ steps.mutation.outputs.score }}" > score.txt

      - name: Upload current mutation score
        uses: actions/upload-artifact@v3
        with:
          name: mutation-score
          path: score.txt
