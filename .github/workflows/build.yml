name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
        
  mutation-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-artifact
          path: target

      - name: Download previous mutation score
        uses: actions/download-artifact@v3
        with:
          name: mutation-score
          path: previous-score || true

      - name: Run mutation tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Check mutation score
        id: mutation
        run: |
          # Récupère le score actuel
          SCORE=1
          echo "Current mutation score: $SCORE"

          # Lit le score précédent si disponible
          if [ -f previous-score/mutation-score.txt ]; then
            PREVIOUS_SCORE=$(cat previous-score/mutation-score.txt)
          else
            PREVIOUS_SCORE=0
          fi
          echo "Previous mutation score: $PREVIOUS_SCORE"

          # Compare
          if [ "$SCORE" -lt "$PREVIOUS_SCORE" ]; then
            echo "Mutation score dropped! Failing the build."
            exit 1
          fi

          # Met à jour le fichier pour upload
          mkdir -p mutation-score
          echo $SCORE > mutation-score/mutation-score.txt

      - name: Upload new mutation score
        uses: actions/upload-artifact@v3
        with:
          name: mutation-score
          path: mutation-score
